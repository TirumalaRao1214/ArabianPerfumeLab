<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Sky gradient: deep indigo at top → warm amber horizon -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#06040e"/>
      <stop offset="35%"  stop-color="#0e0a1f"/>
      <stop offset="65%"  stop-color="#1a0e08"/>
      <stop offset="82%"  stop-color="#2c1503"/>
      <stop offset="100%" stop-color="#3d1c04"/>
    </linearGradient>
    <!-- Horizon glow -->
    <radialGradient id="horiz-glow" cx="50%" cy="100%" r="55%">
      <stop offset="0%"   stop-color="#d4891a" stop-opacity="0.35"/>
      <stop offset="40%"  stop-color="#d4af37" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <!-- Moon glow -->
    <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f7e4a0" stop-opacity="0.35"/>
      <stop offset="60%"  stop-color="#d4af37" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <!-- Sand dune gradient -->
    <linearGradient id="dune1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#5c3210"/>
      <stop offset="50%"  stop-color="#3d1f07"/>
      <stop offset="100%" stop-color="#200e02"/>
    </linearGradient>
    <linearGradient id="dune2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#7a4418"/>
      <stop offset="60%"  stop-color="#3a1a05"/>
      <stop offset="100%" stop-color="#1a0a01"/>
    </linearGradient>
    <linearGradient id="dune3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#9a5c20"/>
      <stop offset="50%"  stop-color="#4a2008"/>
      <stop offset="100%" stop-color="#0b0704"/>
    </linearGradient>
    <!-- Dune crest highlight shimmer -->
    <linearGradient id="crest1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#d4a855" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#f0d882" stop-opacity="0.22"/>
      <stop offset="55%"  stop-color="#d4af37" stop-opacity="0.35"/>
      <stop offset="75%"  stop-color="#f0d882" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="crest2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c49020" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#f7e4a0" stop-opacity="0.28"/>
      <stop offset="60%"  stop-color="#d4af37" stop-opacity="0.38"/>
      <stop offset="85%"  stop-color="#e8c860" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <!-- Palm tree shadow -->
    <linearGradient id="palm-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1a0e04"/>
      <stop offset="100%" stop-color="#0b0704"/>
    </linearGradient>
    <!-- Dark overlay for text legibility -->
    <linearGradient id="overlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0b0c0e" stop-opacity="0.70"/>
      <stop offset="45%"  stop-color="#0b0c0e" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#0b0c0e" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- ── Sky ── -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- ── Stars (hand-placed clusters for authenticity) ── -->
  <g fill="#f7e4a0" opacity="0.75">
    <!-- bright prominent stars -->
    <circle cx="1680" cy="60"  r="2.2"/>
    <circle cx="1540" cy="38"  r="1.8"/>
    <circle cx="1750" cy="110" r="1.5"/>
    <circle cx="1820" cy="75"  r="1.2"/>
    <circle cx="1610" cy="145" r="1.6"/>
    <circle cx="1480" cy="88"  r="1.3"/>
    <circle cx="1440" cy="170" r="1.8"/>
    <circle cx="1350" cy="55"  r="1.4"/>
    <circle cx="1290" cy="130" r="1.1"/>
    <circle cx="1200" cy="70"  r="1.6"/>
    <circle cx="1130" cy="38"  r="2.0"/>
    <circle cx="1060" cy="95"  r="1.2"/>
    <circle cx="980"  cy="52"  r="1.5"/>
    <circle cx="920"  cy="140" r="1.0"/>
    <circle cx="860"  cy="28"  r="1.8"/>
    <circle cx="790"  cy="105" r="1.3"/>
    <circle cx="730"  cy="60"  r="1.1"/>
    <circle cx="670"  cy="145" r="1.4"/>
    <circle cx="600"  cy="42"  r="1.6"/>
    <circle cx="540"  cy="90"  r="1.2"/>
    <circle cx="470"  cy="22"  r="1.9"/>
    <circle cx="400"  cy="120" r="1.0"/>
    <circle cx="340"  cy="65"  r="1.5"/>
    <circle cx="270"  cy="38"  r="1.3"/>
    <circle cx="200"  cy="100" r="1.7"/>
    <circle cx="140"  cy="55"  r="1.1"/>
    <circle cx="80"   cy="142" r="1.4"/>
    <!-- dimmer background stars -->
    <circle cx="1770" cy="180" r="0.8" opacity="0.5"/>
    <circle cx="1700" cy="155" r="0.7" opacity="0.45"/>
    <circle cx="1630" cy="200" r="0.9" opacity="0.5"/>
    <circle cx="1560" cy="120" r="0.6" opacity="0.4"/>
    <circle cx="1500" cy="200" r="0.8" opacity="0.5"/>
    <circle cx="1420" cy="140" r="0.7" opacity="0.45"/>
    <circle cx="1380" cy="210" r="0.6" opacity="0.4"/>
    <circle cx="1300" cy="180" r="0.9" opacity="0.5"/>
    <circle cx="1240" cy="110" r="0.7" opacity="0.45"/>
    <circle cx="1160" cy="175" r="0.8" opacity="0.5"/>
    <circle cx="1090" cy="148" r="0.6" opacity="0.4"/>
    <circle cx="1020" cy="185" r="0.7" opacity="0.45"/>
    <circle cx="950"  cy="115" r="0.9" opacity="0.5"/>
    <circle cx="880"  cy="175" r="0.7" opacity="0.45"/>
    <circle cx="810"  cy="148" r="0.8" opacity="0.5"/>
    <circle cx="745"  cy="200" r="0.6" opacity="0.4"/>
    <circle cx="700"  cy="110" r="0.7" opacity="0.45"/>
    <circle cx="625"  cy="175" r="0.8" opacity="0.5"/>
    <circle cx="558"  cy="140" r="0.6" opacity="0.4"/>
    <circle cx="494"  cy="170" r="0.7" opacity="0.45"/>
    <circle cx="430"  cy="85"  r="0.8" opacity="0.5"/>
    <circle cx="360"  cy="185" r="0.6" opacity="0.4"/>
    <circle cx="295"  cy="160" r="0.7" opacity="0.45"/>
    <circle cx="228"  cy="55"  r="0.8" opacity="0.5"/>
    <circle cx="165"  cy="180" r="0.6" opacity="0.4"/>
    <circle cx="105"  cy="95"  r="0.7" opacity="0.45"/>
    <circle cx="42"   cy="70"  r="0.8" opacity="0.5"/>
  </g>

  <!-- ── Crescent Moon (upper right) ── -->
  <!-- Moon glow halo -->
  <ellipse cx="1620" cy="155" rx="90" ry="90" fill="url(#moon-glow)"/>
  <!-- Moon disc -->
  <circle cx="1620" cy="155" r="34" fill="#f7e4a0" opacity="0.92"/>
  <!-- Shadow circle to carve out crescent -->
  <circle cx="1646" cy="147" r="31" fill="#120e1c"/>

  <!-- ── Horizon glow ── -->
  <rect width="1920" height="1080" fill="url(#horiz-glow)"/>

  <!-- ── Background distant dune ridge (very far, muted) ── -->
  <path d="M0,780 Q160,720 320,750 Q480,780 640,730 Q800,680 960,720 Q1120,760 1280,710 Q1440,660 1600,700 Q1760,740 1920,700 L1920,1080 L0,1080 Z"
        fill="#1e1006" opacity="0.9"/>

  <!-- ── Mid dune layer ── -->
  <path d="M0,820 Q240,760 400,795 Q520,820 660,775 Q820,725 1020,770 Q1200,810 1380,758 Q1560,705 1720,748 Q1840,778 1920,755 L1920,1080 L0,1080 Z"
        fill="url(#dune1)"/>
  <!-- Mid dune crest highlight -->
  <path d="M0,820 Q240,760 400,795 Q520,820 660,775 Q820,725 1020,770 Q1200,810 1380,758 Q1560,705 1720,748 Q1840,778 1920,755"
        fill="none" stroke="url(#crest1)" stroke-width="3" opacity="0.6"/>

  <!-- ── Foreground dune — main large dune ── -->
  <path d="M-20,900 Q180,830 380,870 Q560,905 720,855 Q880,800 1080,850 Q1280,900 1500,842 Q1680,790 1820,830 Q1900,855 1940,840 L1940,1080 L-20,1080 Z"
        fill="url(#dune2)"/>
  <!-- Foreground dune crest highlight -->
  <path d="M-20,900 Q180,830 380,870 Q560,905 720,855 Q880,800 1080,850 Q1280,900 1500,842 Q1680,790 1820,830"
        fill="none" stroke="url(#crest2)" stroke-width="4" opacity="0.65"/>

  <!-- ── Nearest dune bottom edge ── -->
  <path d="M-20,960 Q200,935 450,955 Q700,975 900,940 Q1100,905 1300,940 Q1500,970 1700,945 Q1850,928 1940,940 L1940,1080 L-20,1080 Z"
        fill="#12090200" opacity="0.85"/>
  <path d="M-20,970 Q200,948 450,965 Q700,982 900,952 Q1100,920 1300,952 Q1500,982 1700,958 Q1850,942 1940,952 L1940,1080 L-20,1080 Z"
        fill="#0b0704"/>

  <!-- ══════════════════════════════════════════════
       CAMEL CARAVAN SILHOUETTES (right side, horizon)
       Each camel = body ellipse + neck + head + legs + hump(s)
       ══════════════════════════════════════════════ -->

  <!-- Camel 1 — large, front-right, walking -->
  <g transform="translate(1320, 745)" fill="#0f0803" opacity="0.88">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="70" ry="32"/>
    <!-- Single hump -->
    <ellipse cx="-10" cy="-34" rx="26" ry="20"/>
    <!-- Neck -->
    <rect x="38" y="-38" width="14" height="48" rx="7" transform="rotate(-12 38 -38)"/>
    <!-- Head -->
    <ellipse cx="60" cy="-44" rx="18" ry="12" transform="rotate(-10 60 -44)"/>
    <!-- Snout elongation -->
    <ellipse cx="74" cy="-40" rx="10" ry="7" transform="rotate(5 74 -40)"/>
    <!-- Ear -->
    <ellipse cx="55" cy="-55" rx="5" ry="7" transform="rotate(-15 55 -55)"/>
    <!-- Front legs -->
    <rect x="28"  y="28" width="10" height="55" rx="5" transform="rotate(-5 28 28)"/>
    <rect x="44"  y="28" width="10" height="48" rx="5" transform="rotate(8 44 28)"/>
    <!-- Back legs -->
    <rect x="-44" y="28" width="10" height="50" rx="5" transform="rotate(-8 -44 28)"/>
    <rect x="-30" y="28" width="10" height="58" rx="5" transform="rotate(5 -30 28)"/>
    <!-- Tail -->
    <path d="M-68,5 Q-84,15 -80,28" fill="none" stroke="#0f0803" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Camel 2 — medium, slightly behind and left -->
  <g transform="translate(1190, 758)" fill="#0d0702" opacity="0.75">
    <ellipse cx="0" cy="0" rx="58" ry="26"/>
    <ellipse cx="-8" cy="-28" rx="22" ry="17"/>
    <rect x="30" y="-32" width="12" height="40" rx="6" transform="rotate(-14 30 -32)"/>
    <ellipse cx="50" cy="-38" rx="15" ry="10" transform="rotate(-8 50 -38)"/>
    <ellipse cx="61" cy="-35" rx="8" ry="6" transform="rotate(4 61 -35)"/>
    <ellipse cx="46" cy="-48" rx="4" ry="6" transform="rotate(-12 46 -48)"/>
    <rect x="22"  y="22" width="9"  height="46" rx="4" transform="rotate(-4 22 22)"/>
    <rect x="36"  y="22" width="9"  height="40" rx="4" transform="rotate(7 36 22)"/>
    <rect x="-36" y="22" width="9"  height="42" rx="4" transform="rotate(-6 -36 22)"/>
    <rect x="-24" y="22" width="9"  height="48" rx="4" transform="rotate(4 -24 22)"/>
    <path d="M-56,4 Q-68,12 -65,22" fill="none" stroke="#0d0702" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Camel 3 — small, most distant (right-most, farthest) -->
  <g transform="translate(1470, 732)" fill="#0d0702" opacity="0.65">
    <ellipse cx="0" cy="0" rx="48" ry="21"/>
    <ellipse cx="-6" cy="-22" rx="18" ry="13"/>
    <rect x="24" y="-25" width="10" height="32" rx="5" transform="rotate(-14 24 -25)"/>
    <ellipse cx="40" cy="-30" rx="12" ry="8" transform="rotate(-8 40 -30)"/>
    <ellipse cx="49" cy="-27" rx="7" ry="5" transform="rotate(4 49 -27)"/>
    <ellipse cx="36" cy="-38" rx="3" ry="5"/>
    <rect x="18"  y="18" width="8" height="38" rx="4" transform="rotate(-4 18 18)"/>
    <rect x="30"  y="18" width="8" height="33" rx="4" transform="rotate(7 30 18)"/>
    <rect x="-30" y="18" width="8" height="35" rx="4" transform="rotate(-5 -30 18)"/>
    <rect x="-20" y="18" width="8" height="40" rx="4" transform="rotate(3 -20 18)"/>
    <path d="M-46,3 Q-55,10 -53,18" fill="none" stroke="#0d0702" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Camel 4 — tiny silhouette far right on horizon -->
  <g transform="translate(1620, 718)" fill="#0c0602" opacity="0.5">
    <ellipse cx="0" cy="0" rx="34" ry="15"/>
    <ellipse cx="-4" cy="-16" rx="13" ry="10"/>
    <rect x="17" y="-18" width="7" height="24" rx="3" transform="rotate(-14 17 -18)"/>
    <ellipse cx="28" cy="-22" rx="9" ry="6" transform="rotate(-8 28 -22)"/>
    <rect x="12"  y="12" width="6" height="28" rx="3"/>
    <rect x="22"  y="12" width="6" height="24" rx="3" transform="rotate(6 22 12)"/>
    <rect x="-22" y="12" width="6" height="26" rx="3" transform="rotate(-5 -22 12)"/>
    <rect x="-14" y="12" width="6" height="30" rx="3"/>
  </g>

  <!-- ══════════════════════════════════════════════
       PALM TREE SILHOUETTES (left side)
       ══════════════════════════════════════════════ -->

  <!-- Palm 1 — tall, far left -->
  <g transform="translate(95, 650)" fill="#0f0803" opacity="0.72">
    <!-- Trunk — slightly curved -->
    <path d="M0,260 Q8,160 -5,60 Q-10,20 2,0" fill="none" stroke="#0f0803" stroke-width="12" stroke-linecap="round"/>
    <!-- Fronds -->
    <path d="M2,0 Q-60,-40 -90,-75"  fill="none" stroke="#0f0803" stroke-width="7" stroke-linecap="round"/>
    <path d="M2,0 Q-40,-65 -55,-105" fill="none" stroke="#0f0803" stroke-width="6" stroke-linecap="round"/>
    <path d="M2,0 Q10,-70 0,-110"    fill="none" stroke="#0f0803" stroke-width="7" stroke-linecap="round"/>
    <path d="M2,0 Q55,-55 75,-90"    fill="none" stroke="#0f0803" stroke-width="6" stroke-linecap="round"/>
    <path d="M2,0 Q70,-30 100,-50"   fill="none" stroke="#0f0803" stroke-width="7" stroke-linecap="round"/>
    <!-- Frond sub-leaves -->
    <path d="M-38,-52 Q-55,-60 -70,-50"  fill="none" stroke="#0f0803" stroke-width="3" stroke-linecap="round"/>
    <path d="M-25,-75 Q-40,-90 -50,-85"  fill="none" stroke="#0f0803" stroke-width="3" stroke-linecap="round"/>
    <path d="M40,-60 Q55,-70 68,-58"     fill="none" stroke="#0f0803" stroke-width="3" stroke-linecap="round"/>
    <path d="M55,-35 Q70,-45 80,-32"     fill="none" stroke="#0f0803" stroke-width="3" stroke-linecap="round"/>
    <!-- Date clusters -->
    <circle cx="2"   cy="-5" r="5" fill="#1a0e04"/>
    <circle cx="-8"  cy="-8" r="4" fill="#1a0e04"/>
    <circle cx="10"  cy="-3" r="4" fill="#1a0e04"/>
  </g>

  <!-- Palm 2 — shorter, leaning right -->
  <g transform="translate(195, 710)" fill="#0d0702" opacity="0.60">
    <path d="M0,200 Q12,120 5,40 Q2,10 10,0" fill="none" stroke="#0d0702" stroke-width="9" stroke-linecap="round"/>
    <path d="M10,0 Q-45,-28 -65,-55"  fill="none" stroke="#0d0702" stroke-width="5" stroke-linecap="round"/>
    <path d="M10,0 Q-25,-50 -30,-82"  fill="none" stroke="#0d0702" stroke-width="5" stroke-linecap="round"/>
    <path d="M10,0 Q15,-55 12,-88"    fill="none" stroke="#0d0702" stroke-width="5" stroke-linecap="round"/>
    <path d="M10,0 Q50,-38 68,-62"    fill="none" stroke="#0d0702" stroke-width="5" stroke-linecap="round"/>
    <path d="M10,0 Q62,-20 82,-35"    fill="none" stroke="#0d0702" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Palm 3 — very small, distant far left -->
  <g transform="translate(40, 760)" fill="#0c0602" opacity="0.45">
    <path d="M0,140 Q6,85 2,28 Q0,8 4,0" fill="none" stroke="#0c0602" stroke-width="7" stroke-linecap="round"/>
    <path d="M4,0 Q-32,-18 -48,-38" fill="none" stroke="#0c0602" stroke-width="4" stroke-linecap="round"/>
    <path d="M4,0 Q-15,-35 -16,-56" fill="none" stroke="#0c0602" stroke-width="4" stroke-linecap="round"/>
    <path d="M4,0 Q8,-38 6,-60"     fill="none" stroke="#0c0602" stroke-width="4" stroke-linecap="round"/>
    <path d="M4,0 Q36,-22 48,-40"   fill="none" stroke="#0c0602" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ══════════════════════════════════════════════
       DISTANT DOMED ARCHITECTURE (left horizon)
       Suggests an Arabian palace / mosque
       ══════════════════════════════════════════════ -->
  <g transform="translate(260, 755)" fill="#110a03" opacity="0.40">
    <!-- Main dome -->
    <ellipse cx="0" cy="-30" rx="38" ry="35"/>
    <rect x="-36" y="-30" width="72" height="30" rx="2"/>
    <!-- Minaret left -->
    <rect x="-58" y="-80" width="12" height="80" rx="2"/>
    <path d="M-64,-80 Q-52,-96 -40,-80 Z"/>
    <circle cx="-52" cy="-100" r="4"/>
    <!-- Minaret right -->
    <rect x="46" y="-72" width="10" height="72" rx="2"/>
    <path d="M40,-72 Q51,-86 62,-72 Z"/>
    <circle cx="51" cy="-90" r="3.5"/>
    <!-- Onion finial on dome -->
    <path d="M-8,-65 Q0,-85 8,-65 Q4,-70 0,-72 Q-4,-70 -8,-65 Z"/>
    <!-- Arched windows -->
    <path d="M-18,-8 Q-10,-22 -2,-8" fill="none" stroke="#110a03" stroke-width="2"/>
    <path d="M2,-8  Q10,-22 18,-8"   fill="none" stroke="#110a03" stroke-width="2"/>
  </g>

  <!-- Left-side text legibility gradient overlay -->
  <rect width="1920" height="1080" fill="url(#overlay)"/>

  <!-- Subtle overall darkening at very bottom -->
  <rect y="900" width="1920" height="180" fill="#0b0704" opacity="0.6"/>
</svg>
