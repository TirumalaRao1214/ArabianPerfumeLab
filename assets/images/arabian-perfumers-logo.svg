<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" width="360" height="150">
  <defs>
    <!-- Black background for logo area -->
    <linearGradient id="goldMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f7e4a0"/>
      <stop offset="30%"  stop-color="#d4af37"/>
      <stop offset="65%"  stop-color="#c49b20"/>
      <stop offset="100%" stop-color="#8a6b10"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f0d882"/>
      <stop offset="45%"  stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7520"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f7e4a0"/>
      <stop offset="50%"  stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6b10"/>
    </linearGradient>
  </defs>

  <!-- ── Dark background pill so logo reads on any site background ── -->
  <rect x="0" y="0" width="360" height="150" rx="6" fill="#0b0c0e" opacity="0"/>

  <!-- ══════════════════════════════════════════
       SUNBURST / CROWN RAYS (top centre)
       ══════════════════════════════════════════ -->
  <g transform="translate(180,8)" fill="url(#goldMain)">
    <!-- Centre tall spike -->
    <polygon points="-1.5,0  1.5,0  0.8,34  -0.8,34" opacity="0.97"/>
    <!-- Pairs of progressively shorter spikes radiating out -->
    <polygon points="-1,0  1,0  0.7,28  -0.7,28" transform="rotate(12 0 2)"  opacity="0.92"/>
    <polygon points="-1,0  1,0  0.7,28  -0.7,28" transform="rotate(-12 0 2)" opacity="0.92"/>
    <polygon points="-1,0  1,0  0.6,22  -0.6,22" transform="rotate(24 0 2)"  opacity="0.85"/>
    <polygon points="-1,0  1,0  0.6,22  -0.6,22" transform="rotate(-24 0 2)" opacity="0.85"/>
    <polygon points="-1,0  1,0  0.5,17  -0.5,17" transform="rotate(36 0 2)"  opacity="0.78"/>
    <polygon points="-1,0  1,0  0.5,17  -0.5,17" transform="rotate(-36 0 2)" opacity="0.78"/>
    <polygon points="-1,0  1,0  0.4,12  -0.4,12" transform="rotate(48 0 2)"  opacity="0.70"/>
    <polygon points="-1,0  1,0  0.4,12  -0.4,12" transform="rotate(-48 0 2)" opacity="0.70"/>
    <polygon points="-1,0  1,0  0.3,8   -0.3,8"  transform="rotate(60 0 2)"  opacity="0.60"/>
    <polygon points="-1,0  1,0  0.3,8   -0.3,8"  transform="rotate(-60 0 2)" opacity="0.60"/>
    <polygon points="-1,0  1,0  0.2,5   -0.2,5"  transform="rotate(72 0 2)"  opacity="0.45"/>
    <polygon points="-1,0  1,0  0.2,5   -0.2,5"  transform="rotate(-72 0 2)" opacity="0.45"/>
  </g>

  <!-- ══════════════════════════════════════════
       CROWN ARC BANDS (double arch beneath rays)
       ══════════════════════════════════════════ -->
  <!-- Outer arch -->
  <path d="M148,44 Q180,32 212,44"
        fill="none" stroke="url(#goldMain)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Inner arch -->
  <path d="M152,49 Q180,39 208,49"
        fill="none" stroke="url(#goldMain)" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>

  <!-- Small decorative dots on arch shoulders -->
  <circle cx="148" cy="44" r="2" fill="url(#goldMain)"/>
  <circle cx="212" cy="44" r="2" fill="url(#goldMain)"/>

  <!-- ══════════════════════════════════════════
       CENTRAL BODY: triangular fan / pointed arch
       ══════════════════════════════════════════ -->
  <!-- Outer triangle fan -->
  <path d="M180,42 L155,82 L205,82 Z"
        fill="none" stroke="url(#goldMain)" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Inner teardrop / drop ornament -->
  <path d="M180,50 Q173,62 180,74 Q187,62 180,50 Z"
        fill="none" stroke="url(#goldMain)" stroke-width="1.6"/>
  <!-- Tiny diamond at base of drop -->
  <polygon points="180,74 183,78 180,82 177,78"
           fill="none" stroke="url(#goldMain)" stroke-width="1.2" opacity="0.85"/>

  <!-- ══════════════════════════════════════════
       LEFT SCROLL WING
       ══════════════════════════════════════════ -->
  <!-- Main scroll arm flowing from left corner of triangle -->
  <path d="M155,82 Q136,80 124,65 Q113,52 124,46 Q132,42 136,48 Q128,54 136,60 Q148,68 155,82"
        fill="none" stroke="url(#goldMain)" stroke-width="1.9" stroke-linecap="round"/>
  <!-- Outer spiral of scroll -->
  <path d="M124,65 Q115,59 118,51"
        fill="none" stroke="url(#goldMain)" stroke-width="1.3" stroke-linecap="round" opacity="0.82"/>
  <!-- Left leaf sprigs emanating from scroll -->
  <path d="M128,63 Q118,60 119,52"
        fill="none" stroke="url(#goldMain)" stroke-width="1.1" stroke-linecap="round" opacity="0.72"/>
  <path d="M133,73 Q122,70 124,61"
        fill="none" stroke="url(#goldMain)" stroke-width="1.0" stroke-linecap="round" opacity="0.65"/>
  <!-- Left lower leaf -->
  <path d="M120,50 Q112,46 116,40"
        fill="none" stroke="url(#goldMain)" stroke-width="1.1" stroke-linecap="round" opacity="0.68"/>
  <path d="M122,53 Q110,50 114,42"
        fill="none" stroke="url(#goldMain)" stroke-width="0.9" stroke-linecap="round" opacity="0.55"/>
  <!-- Decorative dot at scroll tip -->
  <circle cx="124" cy="46" r="1.8" fill="url(#goldMain)" opacity="0.9"/>

  <!-- ══════════════════════════════════════════
       RIGHT SCROLL WING (mirror)
       ══════════════════════════════════════════ -->
  <path d="M205,82 Q224,80 236,65 Q247,52 236,46 Q228,42 224,48 Q232,54 224,60 Q212,68 205,82"
        fill="none" stroke="url(#goldMain)" stroke-width="1.9" stroke-linecap="round"/>
  <path d="M236,65 Q245,59 242,51"
        fill="none" stroke="url(#goldMain)" stroke-width="1.3" stroke-linecap="round" opacity="0.82"/>
  <path d="M232,63 Q242,60 241,52"
        fill="none" stroke="url(#goldMain)" stroke-width="1.1" stroke-linecap="round" opacity="0.72"/>
  <path d="M227,73 Q238,70 236,61"
        fill="none" stroke="url(#goldMain)" stroke-width="1.0" stroke-linecap="round" opacity="0.65"/>
  <path d="M240,50 Q248,46 244,40"
        fill="none" stroke="url(#goldMain)" stroke-width="1.1" stroke-linecap="round" opacity="0.68"/>
  <path d="M238,53 Q250,50 246,42"
        fill="none" stroke="url(#goldMain)" stroke-width="0.9" stroke-linecap="round" opacity="0.55"/>
  <circle cx="236" cy="46" r="1.8" fill="url(#goldMain)" opacity="0.9"/>

  <!-- ══════════════════════════════════════════
       BRAND NAME  — "Arabian Perfumer's"
       ══════════════════════════════════════════ -->
  <text
    x="180" y="108"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', 'Palatino Linotype', Palatino, serif"
    font-style="italic"
    font-size="28"
    fill="url(#goldText)"
    letter-spacing="0.5">Arabian Perfumer's</text>

  <!-- Thin decorative rule under brand name -->
  <line x1="100" y1="114" x2="260" y2="114"
        stroke="url(#goldShine)" stroke-width="0.7" opacity="0.55"/>

  <!-- ══════════════════════════════════════════
       TAGLINE
       ══════════════════════════════════════════ -->
  <text
    x="180" y="132"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="12.5"
    fill="url(#goldText)"
    letter-spacing="1.2"
    opacity="0.88">Your Favourite Perfume Is Here</text>
</svg>
