<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#050a16"/>
      <stop offset="100%" stop-color="#0b0c0e"/>
    </radialGradient>
    <linearGradient id="diffuserBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(212,175,55,0.2)"/>
      <stop offset="35%" stop-color="rgba(240,220,160,0.55)"/>
      <stop offset="65%" stop-color="rgba(255,245,200,0.7)"/>
      <stop offset="100%" stop-color="rgba(180,140,50,0.2)"/>
    </linearGradient>
    <linearGradient id="liquidDiff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(180,220,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(80,140,200,0.85)"/>
    </linearGradient>
    <linearGradient id="capDiff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7e7b4"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#7a5c10"/>
    </linearGradient>
    <filter id="reedGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="ambientGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#001830" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="480" fill="url(#bg)"/>
  <ellipse cx="200" cy="260" rx="120" ry="90" fill="#4488cc" opacity="0.10" filter="url(#ambientGlow)"/>
  <ellipse cx="200" cy="435" rx="70" ry="13" fill="#000" opacity="0.4"/>

  <!-- REED STICKS fanning out from bottle neck -->
  <g filter="url(#reedGlow)" opacity="0.75">
    <!-- Left outer reed -->
    <line x1="183" y1="168" x2="130" y2="65" stroke="#8B7540" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="183" y1="168" x2="130" y2="65" stroke="rgba(200,170,80,0.5)" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Left inner reed -->
    <line x1="190" y1="165" x2="165" y2="58" stroke="#9a8548" stroke-width="2" stroke-linecap="round"/>
    <!-- Center reed (straight up) -->
    <line x1="200" y1="163" x2="200" y2="52" stroke="#b09a50" stroke-width="3" stroke-linecap="round"/>
    <!-- Right inner reed -->
    <line x1="210" y1="165" x2="235" y2="58" stroke="#9a8548" stroke-width="2" stroke-linecap="round"/>
    <!-- Right outer reed -->
    <line x1="217" y1="168" x2="270" y2="65" stroke="#8B7540" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Far right reed -->
    <line x1="222" y1="170" x2="295" y2="80" stroke="#7a6530" stroke-width="2" stroke-linecap="round"/>
    <!-- Far left reed -->
    <line x1="178" y1="170" x2="105" y2="80" stroke="#7a6530" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <!-- BOTTLE BODY -->
    <!-- Bottle shadow -->
    <ellipse cx="200" cy="424" rx="62" ry="12" fill="#000" opacity="0.3"/>
    <!-- Bottle body -->
    <rect x="140" y="215" width="120" height="200" rx="20" fill="url(#diffuserBody)"/>
    <!-- Liquid inside -->
    <rect x="148" y="225" width="104" height="185" rx="16" fill="url(#liquidDiff)" opacity="0.8"/>
    <!-- Liquid level surface -->
    <ellipse cx="200" cy="320" rx="46" ry="6" fill="rgba(180,220,255,0.5)"/>
    <!-- Glass highlights -->
    <rect x="148" y="235" width="14" height="165" rx="7" fill="rgba(255,255,255,0.20)"/>
    <rect x="238" y="245" width="8" height="140" rx="4" fill="rgba(255,255,255,0.10)"/>
    <!-- Bottom rim -->
    <rect x="140" y="394" width="120" height="22" rx="8" fill="rgba(180,150,60,0.2)"/>

    <!-- BOTTLE NECK -->
    <rect x="175" y="175" width="50" height="46" rx="8" fill="url(#diffuserBody)"/>
    <rect x="180" y="180" width="10" height="36" rx="5" fill="rgba(255,255,255,0.18)"/>

    <!-- CAP / STOPPER -->
    <rect x="168" y="158" width="64" height="22" rx="5" fill="url(#capDiff)"/>
    <!-- Cap hole for reeds -->
    <ellipse cx="200" cy="158" rx="18" ry="5" fill="#3a2c08"/>
  </g>

  <!-- LABEL -->
  <rect x="155" y="265" width="90" height="80" rx="4" fill="rgba(0,0,0,0.30)"/>
  <rect x="158" y="268" width="84" height="74" rx="3" fill="none" stroke="#d4af37" stroke-width="0.8" opacity="0.6"/>
  <text x="200" y="285" text-anchor="middle" fill="#f7e7b4" font-family="Georgia,serif" font-size="6.5" letter-spacing="1.5">ARABIAN PERFUMER'S</text>
  <line x1="164" y1="291" x2="236" y2="291" stroke="#d4af37" stroke-width="0.5" opacity="0.5"/>
  <text x="200" y="307" text-anchor="middle" fill="#f7e7b4" font-family="Georgia,serif" font-size="10" font-weight="bold">REED</text>
  <text x="200" y="321" text-anchor="middle" fill="#f7e7b4" font-family="Georgia,serif" font-size="10" font-weight="bold">DIFFUSER</text>
  <line x1="164" y1="328" x2="236" y2="328" stroke="#d4af37" stroke-width="0.5" opacity="0.4"/>
  <text x="200" y="339" text-anchor="middle" fill="#d4af37" font-family="Arial,sans-serif" font-size="6" letter-spacing="1.2" opacity="0.75">HOME FRAGRANCE</text>

  <text x="200" y="468" text-anchor="middle" fill="#d4af37" font-size="9" opacity="0.3">✦</text>
</svg>
