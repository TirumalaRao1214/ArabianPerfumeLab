<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#0b0c0e"/>
    </radialGradient>
    <linearGradient id="stickGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(212,175,55,0.3)"/>
      <stop offset="30%" stop-color="rgba(200,160,80,0.7)"/>
      <stop offset="70%" stop-color="rgba(160,120,40,0.8)"/>
      <stop offset="100%" stop-color="rgba(100,70,20,0.5)"/>
    </linearGradient>
    <linearGradient id="holderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a030"/>
      <stop offset="50%" stop-color="#9a7010"/>
      <stop offset="100%" stop-color="#5a3a00"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="100%" stop-color="#3a1a00"/>
    </linearGradient>
    <filter id="smokeBlur">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2a1800" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="400" height="500" fill="url(#bg)"/>
  <ellipse cx="200" cy="250" rx="140" ry="110" fill="#d4af37" opacity="0.07" filter="url(#glowFilter)"/>
  <ellipse cx="200" cy="455" rx="80" ry="14" fill="#000" opacity="0.4"/>

  <!-- SMOKE WISPS from multiple sticks -->
  <g opacity="0.45" filter="url(#smokeBlur)">
    <path d="M148 150 Q140 120 148 90 Q158 60 146 30" fill="none" stroke="rgba(200,190,170,0.6)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M172 140 Q165 112 173 82 Q183 52 170 22" fill="none" stroke="rgba(200,190,170,0.5)" stroke-width="2" stroke-linecap="round"/>
    <path d="M200 135 Q194 108 201 78 Q209 48 198 18" fill="none" stroke="rgba(200,190,170,0.55)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M228 140 Q234 110 226 82 Q216 52 230 22" fill="none" stroke="rgba(200,190,170,0.45)" stroke-width="2" stroke-linecap="round"/>
    <path d="M252 150 Q260 120 252 90 Q242 60 254 32" fill="none" stroke="rgba(200,190,170,0.4)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <!-- 6 DHOOP STICKS fanned slightly -->
    <!-- Stick 1 (leftmost) -->
    <line x1="148" y1="150" x2="145" y2="360" stroke="#8B4513" stroke-width="5" stroke-linecap="round"/>
    <line x1="148" y1="150" x2="145" y2="360" stroke="url(#stickGrad)" stroke-width="4" stroke-linecap="round"/>
    <!-- Glowing tip -->
    <circle cx="148" cy="152" r="4" fill="#ff6600" opacity="0.9" filter="url(#glowFilter)"/>
    <circle cx="148" cy="152" r="2" fill="#ffbb44"/>

    <!-- Stick 2 -->
    <line x1="172" y1="140" x2="170" y2="360" stroke="#9a5520" stroke-width="5" stroke-linecap="round"/>
    <line x1="172" y1="140" x2="170" y2="360" stroke="url(#stickGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="172" cy="142" r="4" fill="#ff7700" opacity="0.85" filter="url(#glowFilter)"/>
    <circle cx="172" cy="142" r="2" fill="#ffcc55"/>

    <!-- Stick 3 (center) -->
    <line x1="200" y1="135" x2="198" y2="360" stroke="#7a4010" stroke-width="6" stroke-linecap="round"/>
    <line x1="200" y1="135" x2="198" y2="360" stroke="url(#stickGrad)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="200" cy="137" r="5" fill="#ff6600" opacity="0.95" filter="url(#glowFilter)"/>
    <circle cx="200" cy="137" r="2.5" fill="#ffdd66"/>

    <!-- Stick 4 -->
    <line x1="228" y1="140" x2="227" y2="360" stroke="#9a5520" stroke-width="5" stroke-linecap="round"/>
    <line x1="228" y1="140" x2="227" y2="360" stroke="url(#stickGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="228" cy="142" r="4" fill="#ff7700" opacity="0.85" filter="url(#glowFilter)"/>
    <circle cx="228" cy="142" r="2" fill="#ffcc55"/>

    <!-- Stick 5 -->
    <line x1="252" y1="150" x2="252" y2="360" stroke="#8B4513" stroke-width="5" stroke-linecap="round"/>
    <line x1="252" y1="150" x2="252" y2="360" stroke="url(#stickGrad)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="252" cy="152" r="4" fill="#ff6600" opacity="0.9" filter="url(#glowFilter)"/>
    <circle cx="252" cy="152" r="2" fill="#ffbb44"/>

    <!-- HOLDER / STAND -->
    <!-- Base platform -->
    <rect x="110" y="355" width="180" height="30" rx="6" fill="url(#baseGrad)"/>
    <ellipse cx="200" cy="355" rx="90" ry="15" fill="url(#holderGrad)"/>
    <!-- Holder holes for sticks -->
    <circle cx="148" cy="356" r="5" fill="#1a0800"/>
    <circle cx="172" cy="357" r="5" fill="#1a0800"/>
    <circle cx="200" cy="356" r="6" fill="#1a0800"/>
    <circle cx="228" cy="357" r="5" fill="#1a0800"/>
    <circle cx="252" cy="356" r="5" fill="#1a0800"/>
    <!-- Holder carved decoration -->
    <line x1="115" y1="368" x2="285" y2="368" stroke="#d4af37" stroke-width="0.7" opacity="0.4"/>
    <line x1="115" y1="376" x2="285" y2="376" stroke="#d4af37" stroke-width="0.5" opacity="0.3"/>
    <!-- Holder feet -->
    <rect x="120" y="380" width="20" height="12" rx="3" fill="#3a1a00"/>
    <rect x="270" y="380" width="20" height="12" rx="3" fill="#3a1a00"/>
  </g>

  <!-- Label -->
  <text x="200" y="420" text-anchor="middle" fill="#f7e7b4" font-family="Georgia,serif" font-size="8.5" letter-spacing="2">ARABIAN PERFUMER'S</text>
  <line x1="130" y1="426" x2="270" y2="426" stroke="#d4af37" stroke-width="0.5" opacity="0.5"/>
  <text x="200" y="443" text-anchor="middle" fill="#d4af37" font-family="Georgia,serif" font-size="12" font-weight="bold" letter-spacing="1">PREMIUM</text>
  <text x="200" y="457" text-anchor="middle" fill="#d4af37" font-family="Georgia,serif" font-size="11" letter-spacing="1">DHOOP STICKS</text>
  <text x="200" y="471" text-anchor="middle" fill="#8aba88" font-family="Arial,sans-serif" font-size="7.5" letter-spacing="1.5" opacity="0.8">6 FRAGRANCE TYPES</text>
  <text x="200" y="490" text-anchor="middle" fill="#d4af37" font-size="8" opacity="0.3">✦</text>
</svg>
