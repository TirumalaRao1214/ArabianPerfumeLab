<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a0d02"/>
      <stop offset="100%" stop-color="#0b0c0e"/>
    </radialGradient>
    <linearGradient id="bottleGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(180,140,40,0.3)"/>
      <stop offset="35%" stop-color="rgba(240,210,120,0.65)"/>
      <stop offset="65%" stop-color="rgba(255,240,170,0.75)"/>
      <stop offset="100%" stop-color="rgba(160,120,30,0.3)"/>
    </linearGradient>
    <linearGradient id="bottleClear" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(180,200,255,0.2)"/>
      <stop offset="35%" stop-color="rgba(220,235,255,0.50)"/>
      <stop offset="65%" stop-color="rgba(240,245,255,0.65)"/>
      <stop offset="100%" stop-color="rgba(160,180,240,0.2)"/>
    </linearGradient>
    <linearGradient id="liquidAttar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a017" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7c4d00" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="capGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7e7b4"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#7a5010"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2a1800" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="460" fill="url(#bg)"/>
  <ellipse cx="200" cy="290" rx="160" ry="100" fill="#d4af37" opacity="0.10" filter="url(#glow)"/>
  <ellipse cx="200" cy="420" rx="140" ry="18" fill="#000" opacity="0.35"/>

  <g filter="url(#shadow)">
    <!-- THREE ATTAR BOTTLES of different sizes and heights -->

    <!-- LEFT BOTTLE — 6ml slender dark gold -->
    <ellipse cx="115" cy="380" rx="30" ry="8" fill="rgba(0,0,0,0.3)"/>
    <!-- Body -->
    <rect x="92" y="250" width="46" height="132" rx="10" fill="url(#bottleGold)"/>
    <rect x="97" y="257" width="36" height="120" rx="8" fill="url(#liquidAttar)" opacity="0.85"/>
    <rect x="97" y="265" width="7" height="106" rx="4" fill="rgba(255,255,255,0.20)"/>
    <!-- Neck -->
    <rect x="103" y="220" width="24" height="36" rx="5" fill="url(#bottleGold)"/>
    <!-- Cap -->
    <rect x="98" y="202" width="34" height="22" rx="6" fill="url(#capGold)"/>
    <ellipse cx="115" cy="202" rx="17" ry="6" fill="#f7e7b4" opacity="0.6"/>
    <!-- Label -->
    <rect x="99" y="290" width="32" height="50" rx="2" fill="rgba(0,0,0,0.25)"/>
    <rect x="101" y="292" width="28" height="46" rx="2" fill="none" stroke="#d4af37" stroke-width="0.6" opacity="0.6"/>
    <text x="115" y="308" text-anchor="middle" fill="#f7e7b4" font-family="Georgia,serif" font-size="5.5" letter-spacing="0.5">ARABIAN</text>
    <text x="115" y="318" text-anchor="middle" fill="#f7e7b4" font-family="Arial,sans-serif" font-size="5" letter-spacing="0.5">PERFUMER'S</text>
    <text x="115" y="331" text-anchor="middle" fill="#d4af37" font-family="Georgia,serif" font-size="6.5" font-weight="bold">ATTAR</text>

    <!-- CENTER BOTTLE — 12ml tall clear glass -->
    <ellipse cx="200" cy="385" rx="38" ry="10" fill="rgba(0,0,0,0.3)"/>
    <!-- Body -->
    <rect x="172" y="220" width="56" height="168" rx="12" fill="url(#bottleClear)"/>
    <rect x="178" y="228" width="44" height="154" rx="9" fill="url(#liquidAttar)" opacity="0.80"/>
    <rect x="178" y="238" width="9" height="136" rx="5" fill="rgba(255,255,255,0.22)"/>
    <!-- Neck -->
    <rect x="183" y="190" width="34" height="36" rx="6" fill="url(#bottleClear)"/>
    <!-- Cap — ornate -->
    <rect x="176" y="168" width="48" height="26" rx="7" fill="url(#capGold)"/>
    <ellipse cx="200" cy="168" rx="24" ry="7" fill="#f7e7b4" opacity="0.65"/>
    <ellipse cx="200" cy="163" rx="10" ry="5" fill="#f7e7b4" opacity="0.5"/>
    <!-- Label -->
    <rect x="180" y="275" width="40" height="65" rx="2" fill="rgba(0,0,0,0.28)"/>
    <rect x="182" y="277" width="36" height="61" rx="2" fill="none" stroke="#d4af37" stroke-width="0.7" opacity="0.6"/>
    <text x="200" y="292" text-anchor="middle" fill="#f7e7b4" font-family="Georgia,serif" font-size="6" letter-spacing="0.5">ARABIAN</text>
    <text x="200" y="303" text-anchor="middle" fill="#f7e7b4" font-family="Arial,sans-serif" font-size="5.5" letter-spacing="0.5">PERFUMER'S</text>
    <line x1="184" y1="308" x2="216" y2="308" stroke="#d4af37" stroke-width="0.5" opacity="0.5"/>
    <text x="200" y="320" text-anchor="middle" fill="#d4af37" font-family="Georgia,serif" font-size="7.5" font-weight="bold">PURE</text>
    <text x="200" y="331" text-anchor="middle" fill="#d4af37" font-family="Georgia,serif" font-size="7.5" font-weight="bold">ATTAR</text>

    <!-- RIGHT BOTTLE — 3ml small gold -->
    <ellipse cx="288" cy="380" rx="26" ry="7" fill="rgba(0,0,0,0.3)"/>
    <!-- Body -->
    <rect x="270" y="270" width="36" height="112" rx="9" fill="url(#bottleGold)"/>
    <rect x="275" y="277" width="26" height="100" rx="7" fill="url(#liquidAttar)" opacity="0.85"/>
    <rect x="275" y="285" width="6" height="86" rx="3" fill="rgba(255,255,255,0.20)"/>
    <!-- Neck -->
    <rect x="279" y="246" width="22" height="28" rx="5" fill="url(#bottleGold)"/>
    <!-- Cap -->
    <rect x="273" y="230" width="30" height="20" rx="5" fill="url(#capGold)"/>
    <ellipse cx="288" cy="230" rx="15" ry="5" fill="#f7e7b4" opacity="0.6"/>
    <!-- Label -->
    <rect x="277" y="298" width="22" height="44" rx="2" fill="rgba(0,0,0,0.25)"/>
    <rect x="279" y="300" width="18" height="40" rx="2" fill="none" stroke="#d4af37" stroke-width="0.6" opacity="0.55"/>
    <text x="288" y="312" text-anchor="middle" fill="#f7e7b4" font-family="Arial,sans-serif" font-size="4.5" letter-spacing="0.3">ARABIAN</text>
    <text x="288" y="321" text-anchor="middle" fill="#d4af37" font-family="Georgia,serif" font-size="5.5" font-weight="bold">ATTAR</text>
    <text x="288" y="333" text-anchor="middle" fill="#d4af37" font-family="Arial,sans-serif" font-size="4.5">3ML</text>
  </g>

  <!-- Bottom label -->
  <text x="200" y="408" text-anchor="middle" fill="#f7e7b4" font-family="Georgia,serif" font-size="8.5" letter-spacing="2">ARABIAN PERFUMER'S</text>
  <line x1="120" y1="414" x2="280" y2="414" stroke="#d4af37" stroke-width="0.5" opacity="0.5"/>
  <text x="200" y="430" text-anchor="middle" fill="#d4af37" font-family="Georgia,serif" font-size="11" font-weight="bold" letter-spacing="1">DISPLAY ATTAR BOTTLES</text>
  <text x="200" y="445" text-anchor="middle" fill="#888" font-family="Arial,sans-serif" font-size="7.5" letter-spacing="1.5" opacity="0.75">3ML · 6ML · 12ML MODELS</text>
  <text x="200" y="458" text-anchor="middle" fill="#d4af37" font-size="8" opacity="0.3">✦</text>
</svg>
