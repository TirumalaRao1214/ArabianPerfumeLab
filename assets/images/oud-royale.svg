<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2c1a0e"/>
      <stop offset="100%" stop-color="#0b0c0e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="900" fill="url(#bg)"/>
  <rect width="800" height="900" fill="url(#glow)"/>
  <!-- Bottle body -->
  <rect x="300" y="200" width="200" height="420" rx="20" fill="#1a1505" stroke="#d4af37" stroke-width="1.5" opacity="0.9"/>
  <!-- Bottle neck -->
  <rect x="345" y="140" width="110" height="70" rx="8" fill="#1a1505" stroke="#d4af37" stroke-width="1.5"/>
  <!-- Cap -->
  <rect x="330" y="100" width="140" height="50" rx="10" fill="#d4af37"/>
  <!-- Label -->
  <rect x="320" y="310" width="160" height="110" rx="4" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
  <text x="400" y="350" text-anchor="middle" fill="#d4af37" font-family="Georgia,serif" font-size="13" letter-spacing="3">OUD ROYALE</text>
  <text x="400" y="375" text-anchor="middle" fill="#d4af37" font-family="Georgia,serif" font-size="9" letter-spacing="2" opacity="0.7">EXTRAIT DE PARFUM</text>
  <text x="400" y="400" text-anchor="middle" fill="#d4af37" font-family="Georgia,serif" font-size="9" letter-spacing="1" opacity="0.5">ARABIAN PERFUME LAB</text>
  <!-- Shimmer lines -->
  <line x1="300" y1="280" x2="500" y2="280" stroke="#d4af37" stroke-width="0.5" opacity="0.2"/>
  <line x1="310" y1="600" x2="490" y2="600" stroke="#d4af37" stroke-width="0.5" opacity="0.2"/>
</svg>
